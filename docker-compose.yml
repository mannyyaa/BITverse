version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bitverse
      POSTGRES_PASSWORD: bitverse
      POSTGRES_DB: bitverse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitverse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
